name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Core & API contract tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "opencv-python-headless>=4.7.0" "numpy>=1.24.0" \
                      "fastapi>=0.100.0" "uvicorn>=0.22.0" "python-multipart>=0.0.6" \
                      "pydantic>=2.0.0" "requests>=2.28.0" "httpx>=0.24.0"

      - name: Core algorithm suite
        run: python test_core.py

      - name: API contract suite
        run: python test_api_contract.py

      - name: HDevelop DSL engine suite
        run: python test_hdev.py
